<text text-anchor="middle" x="613" y="-358.4" font-family="Noto Sans CJK SC" font-size="9.50">【这是二次开发，不是原厂整机】</text>
<text text-anchor="middle" x="613" y="-348.4" font-family="Noto Sans CJK SC" font-size="9.50">• 无手臂（DM4310/DM3507）</text>
<text text-anchor="middle" x="613" y="-338.4" font-family="Noto Sans CJK SC" font-size="9.50">• 无腰部（DM6006）· 无 CAN3</text>
<text text-anchor="middle" x="613" y="-317.4" font-family="Noto Sans CJK SC" font-size="9.50">【电气】</text>
<text text-anchor="middle" x="613" y="-307.4" font-family="Noto Sans CJK SC" font-size="9.50">① 每条腿末端各 1 个 120Ω，共 2 个</text>
<text text-anchor="middle" x="613" y="-297.4" font-family="Noto Sans CJK SC" font-size="9.50">② 反馈帧仲裁 ID 恒为 0x000，</text>
<text text-anchor="middle" x="613" y="-287.4" font-family="Noto Sans CJK SC" font-size="9.50"> &#160;&#160;电机身份在 D0 低 4 位</text>
<text text-anchor="middle" x="613" y="-277.4" font-family="Noto Sans CJK SC" font-size="9.50">③ txqueuelen 必须设 1000</text>
<text text-anchor="middle" x="613" y="-267.4" font-family="Noto Sans CJK SC" font-size="9.50">④ 波特率 1 Mbps</text>
<text text-anchor="middle" x="613" y="-246.4" font-family="Noto Sans CJK SC" font-size="9.50">【对上游的 4 个适配点】</text>
<text text-anchor="middle" x="613" y="-236.4" font-family="Noto Sans CJK SC" font-size="9.50">① CAN 回调按 D0 低4位分发</text>
<text text-anchor="middle" x="613" y="-226.4" font-family="Noto Sans CJK SC" font-size="9.50">② 启用 CAN_RAW_FD_FRAMES</text>
<text text-anchor="middle" x="613" y="-216.4" font-family="Noto Sans CJK SC" font-size="9.50">③ 新增 DM4340P_24V 限幅</text>
<text text-anchor="middle" x="613" y="-206.4" font-family="Noto Sans CJK SC" font-size="9.50">④ 新增 dm_imu_l1 驱动</text>
